plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mobosafe.dashcam'
    compileSdk 36

    defaultConfig {
        applicationId "com.mobosafe.dashcam"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // RootEncoder (formerly rtmp-rtsp-stream-client-java) — Camera2 + mic -> RTMP.
    // Check https://github.com/pedroSG94/RootEncoder for the latest version tag
    // and swap it in if this one has moved on.
    implementation 'com.github.pedroSG94.RootEncoder:library:2.7.3'
}
